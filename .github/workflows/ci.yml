name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build workspace (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout superproject
        uses: actions/checkout@v4

      - name: Checkout submodule over HTTPS
        # .gitmodules uses an SSH URL for local convenience; rewrite it to
        # HTTPS so the Actions token can clone the fork without a deploy key.
        run: |
          git config --global \
            url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image (deps only)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          push: false
          build-args: |
            ROS_DISTRO=lyrical
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build runtime image (rosdep + colcon)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          build-args: |
            ROS_DISTRO=lyrical
          cache-from: type=gha
          cache-to: type=gha,mode=max
