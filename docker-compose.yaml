services:
  botwheel:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: botwheel_explorer:dev
    container_name: botwheel_dev

    # SocketCAN (can0) lives in the host network namespace, so share it.
    # This also gives ROS 2 DDS easy host-level discovery.
    network_mode: host

    # NET_ADMIN: bring up / configure the can0 interface from inside the container
    #   (e.g. `ip link set can0 up type can bitrate 250000`)
    # SYS_RAWIO: raw device access used by some camera/CAN stacks
    # SYS_NICE: set real-time scheduling priorities (ros2_control realtime threads)
    cap_add:
      - NET_ADMIN
      - SYS_RAWIO
      - SYS_NICE

    # Real-time scheduling for ros2_control. Requires the SYS_NICE cap above.
    #   rtprio=99   : allow SCHED_FIFO/RR priorities up to 99
    #   memlock=-1  : unlimited locked memory (no page faults in RT loops)
    # https://control.ros.org/master/doc/ros2_control/controller_manager/doc/userdoc.html
    ulimits:
      rtprio: 99
      memlock: -1

    # Bluetooth gamepad (teleop_twist_joy). The controller is paired on the host
    # with bluetoothctl/bluez and shows up under /dev/input (js* + event*). It is
    # hot-plugged, so its number varies and the node may not exist at container
    # start — hence we bind-mount the whole /dev/input dir (so reconnects appear
    # live, unlike a static `devices:` entry) and allow the whole input device
    # class via a cgroup rule (major 13 = js*/event*/mouse*).
    device_cgroup_rules:
      - 'c 13:* rmw'   # read/mknod/write for all major-13 (input) devices

    # Read the root:input 660 device nodes as the non-root botwheel user. The
    # base image has no "input" group, so use the host's numeric input GID
    # (Docker passes raw GIDs through; kernel perm checks are by GID anyway).
    # Override INPUT_GID if `getent group input` differs on your host.
    # Camera / video devices: add more (video1, video2, ...) to match your hardware.
    group_add:
      - "${INPUT_GID:-996}"
      # - video

    # Xsens MTi IMU. The host udev rule (ansible/playbooks/files/99-xsens-mti.rules)
    # gives it a stable /dev/xsens_mti symlink and 0666 perms; we map that to a
    # fixed /dev/ttyUSB0 inside the container because the driver's default config
    # (scan_for_devices: true) probes /dev/ttyUSB*. Run the udev playbook on the
    # host first, or this device won't exist and `compose up` will fail.
    devices:
      - /dev/xsens_mti:/dev/ttyUSB0
      # - /dev/video0:/dev/video0

    # Live-mount the workspace so you can edit on the host and build inside.
    # The dev image ships dependencies only (no built workspace), so run
    # `colcon build` inside the container when you're ready.
    volumes:
      - ./botwheel_ws:/botwheel_ws
      # Bluetooth gamepad: bind the input dir so hot-plugged js*/event* nodes
      # (controller (re)connects) are visible inside the container live.
      - /dev/input:/dev/input
      # Git auth — SSH keys and identity for git push
      - ~/.ssh:/home/botwheel/.ssh:ro
      - ~/.gitconfig:/home/botwheel/.gitconfig:ro
      # Claude Code — persisted settings/sessions and config
      - ~/.claude:/home/botwheel/.claude
      - ~/.claude.json:/home/botwheel/.claude.json
      # Gemini CLI — persisted credentials after `gemini auth`
      - ~/.gemini:/home/botwheel/.gemini

    environment:
      - ROS_DOMAIN_ID=0

    # Default: idle for development. `docker compose exec botwheel bash` to work inside.
    # To drive the robot, override here or use `docker compose run`, e.g.:
    #   command: ros2 launch odrive_botwheel_explorer botwheel_explorer.launch.py
    command: ["sleep", "infinity"]

    stdin_open: true
    tty: true
    restart: unless-stopped

    # If the explicit caps/devices above are not enough for your hardware,
    # the simplest (less restricted) alternative used by the upstream devcontainer is:
    # privileged: true

  # Runtime image with the workspace prebuilt — drives the robot.
  # Does NOT start with `docker compose up`; opt in with the "robot" profile:
  #   docker compose --profile robot up botwheel-run
  botwheel-run:
    profiles: ["robot"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: botwheel_explorer:runtime
    container_name: botwheel_run
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_RAWIO
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
    devices:
      - /dev/video0:/dev/video0
      # Xsens MTi IMU — see the dev service above for the udev/symlink rationale.
      - /dev/xsens_mti:/dev/ttyUSB0
    # Bluetooth gamepad — see the dev service above for the rationale.
    device_cgroup_rules:
      - 'c 13:* rmw'
    volumes:
      - /dev/input:/dev/input
    group_add:
      - video
      - "${INPUT_GID:-996}"
    environment:
      - ROS_DOMAIN_ID=0
    restart: unless-stopped
    # CMD in the runtime stage already launches botwheel_explorer.launch.py;
    # override `command:` here to run something else.
